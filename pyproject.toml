[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "federated-learning-experiments"
version = "1.0.0"
description = "Personalized federated learning algorithms and benchmarks"
requires-python = ">=3.8"
dependencies = [
    "torch>=2.2.0,<2.3",
    "torchvision>=0.17.0,<0.18",
    "numpy>=1.21.0,<2.0.0",
    "matplotlib>=3.5.0",
    "scikit-learn>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
